<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#637893"/></marker></defs><rect width="1400" height="760" fill="#f5f7fb"/><text x="35" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#24334e">Vision One File Security — solution architecture</text><rect x="310" y="70" width="725" height="425" rx="18" fill="#e8eef8" stroke="#bccbe0"/><text x="330" y="91" font-family="Arial" font-size="12" fill="#52647d">SUPERVISED APPLICATION CONTAINER + PERSISTENT DATA VOLUME</text><path d="M275,137 L335,137" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M695,137 L635,137" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M550,180 L550,200 L680,200 L680,255 L695,255" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M855,180 L855,205 L650,205 L650,255 L635,255" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635,275 L695,275" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M485,320 L485,370" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M275,415 L335,415" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635,415 L695,415" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1015,415 L1060,415" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M485,460 L485,555" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M565,460 L845,555" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M625,460 L1210,555" stroke="#637893" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="95" width="240" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="50" y="126" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Administrator browser</text><text x="50" y="153" font-family="Arial" font-size="12" fill="#52647d">Profiles / results / exports</text><rect x="335" y="95" width="300" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="350" y="126" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Management API + React</text><text x="350" y="153" font-family="Arial" font-size="12" fill="#52647d">Independent management process</text><rect x="695" y="95" width="320" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="710" y="126" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Supervisor / watchdog</text><text x="710" y="153" font-family="Arial" font-size="12" fill="#52647d">Independent service restart</text><rect x="335" y="230" width="300" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="350" y="261" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Scheduler + durable queue</text><text x="350" y="288" font-family="Arial" font-size="12" fill="#52647d">Recursive source polling / bounded queues</text><rect x="695" y="230" width="320" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="710" y="261" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">SQLite WAL + master key</text><text x="710" y="288" font-family="Arial" font-size="12" fill="#52647d">Encrypted config / jobs / results / audit</text><rect x="335" y="370" width="300" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="350" y="401" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Processing workers</text><text x="350" y="428" font-family="Arial" font-size="12" fill="#52647d">Scan pool / optional archives / transfer pool</text><rect x="695" y="370" width="320" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="710" y="401" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Isolated SDK child</text><text x="710" y="428" font-family="Arial" font-size="12" fill="#52647d">Official Go SDK / range requests</text><rect x="1060" y="370" width="300" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="1075" y="401" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">File Security service</text><text x="1075" y="428" font-family="Arial" font-size="12" fill="#52647d">Cloud region OR local scanner</text><rect x="35" y="370" width="240" height="90" rx="10" fill="white" stroke="#aebdd2"/><text x="50" y="401" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Source storage</text><text x="50" y="428" font-family="Arial" font-size="12" fill="#52647d">Blob / Azure Files / SMB / NFS</text><rect x="335" y="555" width="300" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="350" y="586" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Clean destination</text><text x="350" y="613" font-family="Arial" font-size="12" fill="#52647d">CLEAN or explicit NOT SCANNED bypass</text><rect x="695" y="555" width="300" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="710" y="586" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Malicious / quarantine</text><text x="710" y="613" font-family="Arial" font-size="12" fill="#52647d">MALICIOUS + detection evidence</text><rect x="1060" y="555" width="300" height="85" rx="10" fill="white" stroke="#aebdd2"/><text x="1075" y="586" font-family="Arial" font-size="17" font-weight="bold" fill="#24334e">Scan-failed destination</text><text x="1075" y="613" font-family="Arial" font-size="12" fill="#52647d">Unknown / errors / unscanned policy</text><text x="35" y="686" font-family="Arial" font-size="16" fill="#24334e">Before source deletion: destination size + SHA-256 + CRC32C verified; source identity must remain unchanged.</text><text x="35" y="716" font-family="Arial" font-size="14" fill="#52647d">Profiles: up to 100 GB submission / large-file concurrency / timeout / oversized hold or unscanned routing. Engine inspection limits apply.</text><text x="35" y="746" font-family="Arial" font-size="12" fill="#52647d">Optional archive child: Landlock + seccomp, shared bomb limits, up to 20 layers. Original and member SDK scans are required.</text></svg>
name: Build and correctness
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_USER: test, POSTGRES_DB: test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum}
      - run: go test -race ./...
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm run build
        working-directory: web
      - run: go vet ./...
        working-directory: backend

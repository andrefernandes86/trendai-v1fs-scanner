name: Publish container
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and correctness']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Identify release
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/andrefernandes86/trendai-v1fs-scanner:latest
            ghcr.io/andrefernandes86/trendai-v1fs-scanner:sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.title=TrendAI Vision One File Security Scanner
            org.opencontainers.image.source=https://github.com/andrefernandes86/trendai-v1fs-scanner
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        run: |
          echo 'Image: ghcr.io/andrefernandes86/trendai-v1fs-scanner:latest' >> "$GITHUB_STEP_SUMMARY"
          echo 'Platform: linux/amd64' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a new GHCR package, set package visibility to Public in GitHub package settings and verify an anonymous pull.' >> "$GITHUB_STEP_SUMMARY"

services:
  scanner:
    image: trendai-v1fs-scanner:${SCANNER_IMAGE_TAG:-current}
    build: .
    ports: ['8095:8095']
    environment:
      PORT: '8095'
      V1FS_MAX_WORKERS: '${V1FS_MAX_WORKERS:-8}'
      V1FS_TRANSFER_WORKERS: '${V1FS_TRANSFER_WORKERS:-4}'
      V1FS_DATA_DIR: /data
      V1FS_WEB_DIR: /app/dist
    volumes: ['scanner-data:/data']
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    tmpfs: ['/tmp:size=512m,mode=1777']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    healthcheck:
      test: ['CMD', '/app/scanner', '-healthcheck']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  scanner-data:
